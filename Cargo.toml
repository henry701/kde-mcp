[package]
name = "kde-mcp"
version = "0.0.0"
edition = "2021"
rust-version = "1.78"
description = "MCP server for KDE Plasma 6 Wayland desktop control"
license = "MIT"
repository = ""
readme = "README.md"
authors = ["atassis"]
keywords = ["mcp", "kde", "wayland", "computer-use", "agent"]
categories = ["command-line-utilities", "accessibility"]

[[bin]]
name = "kde-mcp"
path = "src/main.rs"

[dependencies]
# MCP server SDK
rmcp = { version = "0.1", features = ["server", "transport-io"] }

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "signal", "sync", "fs"] }
futures = "0.3"
async-trait = "0.1"

# D-Bus (KWin Scripting, ScreenShot2, EIS, AT-SPI)
zbus = { version = "4", default-features = false, features = ["tokio"] }

# libei (input emulation via KWin's EIS fd handoff)
reis = "0.4"

# AT-SPI accessibility tree
atspi = { version = "0.22", features = ["tokio"] }
atspi-common = "0.5"

# Image handling (ARGB from ScreenShot2 → PNG; resize for token budget)
image = { version = "0.25", default-features = false, features = ["png"] }

# PTY for persistent bash session
portable-pty = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / audit
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Errors
thiserror = "1"
anyhow = "1"

# Misc utilities
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
regex = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio-test = "0.4"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 0

# Notes:
# - Versions are targets at design time (2026-05-13). Exact resolved versions
#   may differ; Cargo.lock will pin them once `cargo build` runs.
# - `reis` is the Rust libei binding; depends on system libei >= 1.3.
# - `atspi` 0.22 line uses tokio executor; system at-spi2-core required.
# - `zbus` is pinned to v4 to avoid the v5 breaking changes still in flux.
